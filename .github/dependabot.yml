version: 2
updates:
  # Watches the `FROM portainer/agent:<version>` pin in the Dockerfile. The
  # Home Assistant base image lives in build.yaml, which Dependabot cannot
  # parse — bump that one by hand.
  - package-ecosystem: "docker"
    directory: "/portainer_agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
