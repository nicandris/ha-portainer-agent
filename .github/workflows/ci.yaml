# There is nothing to unit-test in this add-on — it is the official Portainer
# agent binary plus an s6 service — so CI checks the two things that can
# actually break: the add-on config, and whether the image still builds on the
# pinned base for both published architectures.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint add-on config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-app-linter@v2.21.1
        with:
          path: ./portainer_agent

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v7

      # aarch64 is built under emulation; amd64 is native.
      - uses: docker/setup-qemu-action@v4
        if: matrix.arch == 'aarch64'

      # The default docker driver cannot build for a foreign platform.
      - uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        run: |
          set -euo pipefail
          base=$(yq ".build_from.${{ matrix.arch }}" portainer_agent/build.yaml)
          echo "BUILD_FROM=$base"
          case "${{ matrix.arch }}" in
            amd64) platform=linux/amd64 ;;
            aarch64) platform=linux/arm64 ;;
          esac
          docker buildx build \
            --platform "$platform" \
            --build-arg BUILD_FROM="$base" \
            --build-arg BUILD_ARCH="${{ matrix.arch }}" \
            --build-arg BUILD_VERSION="ci" \
            portainer_agent
