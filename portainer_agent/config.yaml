---
name: Portainer Agent
version: "2.45.3"
slug: portainer_agent
description: Exposes this host's Docker to a remote Portainer instance
url: https://github.com/nicandris/ha-portainer-agent
arch:
  - aarch64
  - amd64
init: false
docker_api: true
full_access: true
ports:
  9001/tcp: 9001
ports_description:
  9001/tcp: Portainer agent API
options:
  env_vars: []
schema:
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str
